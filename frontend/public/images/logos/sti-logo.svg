<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" shape-rendering="geometricPrecision">
  <!-- Yellow rounded background -->
  <rect width="240" height="180" rx="14" ry="14" fill="#FFE800"/>

  <!-- Blue bottom bar (rounded bottom corners only) -->
  <rect x="0" y="136" width="240" height="44" fill="#1A5CA8"/>
  <rect x="0" y="136" width="240" height="14" fill="#1A5CA8"/>
  <!-- restore top corners to yellow so only bottom is rounded -->
  <rect x="0" y="136" width="14" height="14" fill="#FFE800"/>
  <rect x="226" y="136" width="14" height="14" fill="#FFE800"/>
  <!-- rounded bottom -->
  <rect x="0" y="150" width="240" height="30" rx="14" ry="14" fill="#1A5CA8"/>

  <!-- BALAGTAS label -->
  <text x="120" y="170" text-anchor="middle" fill="#FFFFFF"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="21" font-weight="900" letter-spacing="4">BALAGTAS</text>

  <!-- Globe body (amber/orange) -->
  <circle cx="66" cy="76" r="50" fill="#F5A800"/>

  <!-- Globe grid lines (blue) -->
  <!-- outer rim -->
  <circle cx="66" cy="76" r="50" fill="none" stroke="#1A5CA8" stroke-width="4.5"/>
  <!-- horizontal latitude bands -->
  <ellipse cx="66" cy="76" rx="50" ry="17" fill="none" stroke="#1A5CA8" stroke-width="3.5"/>
  <ellipse cx="66" cy="76" rx="50" ry="34" fill="none" stroke="#1A5CA8" stroke-width="3.5"/>
  <!-- vertical longitude arcs -->
  <ellipse cx="66" cy="76" rx="20" ry="50" fill="none" stroke="#1A5CA8" stroke-width="3.5"/>
  <ellipse cx="66" cy="76" rx="38" ry="50" fill="none" stroke="#1A5CA8" stroke-width="3.5"/>

  <!-- STI bold text -->
  <text x="173" y="112" text-anchor="middle" fill="#1A5CA8"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="76" font-weight="900">STI</text>
</svg>
